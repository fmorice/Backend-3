spring:
  application:
    name: bff-mobile
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
server:
  port: ${SERVER_PORT:8092}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info

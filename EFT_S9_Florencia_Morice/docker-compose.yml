name: eft-s9-banco-xyz

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://config-server:8888}
  EUREKA_URI: ${EUREKA_URI:-http://eureka-server:8761/eureka/}
  KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eft_s9}
  DB_USERNAME: ${POSTGRES_USER:-eft_s9}
  DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eft_s9}
      POSTGRES_USER: ${POSTGRES_USER:-eft_s9}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    image: eft-s9/config-server:local
    build:
      context: .
      dockerfile: platform/config-server/Dockerfile
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./platform/config-repo:/config-repo:ro
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"

  eureka-server:
    image: eft-s9/eureka-server:local
    build:
      context: .
      dockerfile: platform/eureka-server/Dockerfile
    environment:
      SERVER_PORT: 8761
    ports:
      - "${EUREKA_PORT:-8761}:8761"

  clientes-service:
    image: eft-s9/clientes-service:local
    build:
      context: .
      dockerfile: services/clientes/Dockerfile
    environment: *app-environment
    depends_on:
      - postgres
      - config-server
      - eureka-server
    expose:
      - "8083"

  cuentas-service:
    image: eft-s9/cuentas-service:local
    build:
      context: .
      dockerfile: services/cuentas/Dockerfile
    environment: *app-environment
    depends_on:
      - postgres
      - config-server
      - eureka-server
    expose:
      - "8084"

  pagos-service:
    image: eft-s9/pagos-service:local
    build:
      context: .
      dockerfile: services/pagos/Dockerfile
    environment: *app-environment
    depends_on:
      - postgres
      - config-server
      - eureka-server
    expose:
      - "8085"

  batch-jobs:
    profiles:
      - batch
    image: eft-s9/batch-jobs:local
    build:
      context: .
      dockerfile: batch/batch-jobs/Dockerfile
    environment:
      BATCH_DB_PASSWORD: "${BATCH_DB_PASSWORD:?Set BATCH_DB_PASSWORD in the ignored .env file}"
      MOVIMIENTOS_INPUT_PATH: /app/input/movimientos_financieros_diarios.csv
      MOVIMIENTOS_OUTPUT_DIR: /app/output
      SERVER_PORT: 8086
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
    volumes:
      - ./data/semana_3:/app/input:ro
      - "./batch/batch-jobs/output/validation/docker/${BATCH_RUN_ID:?Set a unique BATCH_RUN_ID}:/app/output"
    expose:
      - "8086"

  bff-web:
    image: eft-s9/bff-web:local
    build:
      context: .
      dockerfile: bff/web/Dockerfile
    environment: *app-environment
    depends_on:
      - config-server
      - eureka-server
    ports:
      - "${BFF_WEB_PORT:-8091}:8091"

  bff-mobile:
    image: eft-s9/bff-mobile:local
    build:
      context: .
      dockerfile: bff/mobile/Dockerfile
    environment: *app-environment
    depends_on:
      - config-server
      - eureka-server
    ports:
      - "${BFF_MOBILE_PORT:-8092}:8092"

  bff-atm:
    image: eft-s9/bff-atm:local
    build:
      context: .
      dockerfile: bff/atm/Dockerfile
    environment: *app-environment
    depends_on:
      - config-server
      - eureka-server
    ports:
      - "${BFF_ATM_PORT:-8093}:8093"

volumes:
  postgres-data:

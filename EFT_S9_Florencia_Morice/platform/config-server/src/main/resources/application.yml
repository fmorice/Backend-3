spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./platform/config-repo}
server:
  port: ${SERVER_PORT:8888}
management:
  endpoints:
    web:
      exposure:
        include: health,info

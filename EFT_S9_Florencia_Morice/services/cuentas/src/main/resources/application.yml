spring:
  application:
    name: cuentas-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eft_s9}
    username: ${DB_USERNAME:eft_s9}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
server:
  port: ${SERVER_PORT:8084}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info

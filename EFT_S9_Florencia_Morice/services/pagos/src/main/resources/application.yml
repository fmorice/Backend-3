spring:
  application:
    name: pagos-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eft_s9}
    username: ${DB_USERNAME:eft_s9}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://banco-xyz-keycloak:8080/realms/banco-xyz/protocol/openid-connect/certs}
server:
  port: ${SERVER_PORT:8085}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topic:
      transferencias: banco-xyz.transferencias
